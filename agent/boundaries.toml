# Boundary manifest for the jankurai public hub.
#
# The hub is a control-plane-only repository: it carries the installer, GitHub
# Action, family manifest, lockfile, fusion script, and agent maps. It ships no
# Rust crate, TypeScript/web surface, PostgreSQL database, queue runtime, or
# Python AI/data service, so no stack-arm boundary block applies here. Only the
# family stack identity is declared. See docs/boundaries.md for the prose
# companion. If a future change adds a product surface, declare its boundary
# block here first, then add matching owner, test, and proof entries.

[stack]
id = "rust-ts-vite-react-postgres-bounded-python"
version = "0.9.0"
# Python is confined to reviewed GIF build and verification tools.
# This classification leaves source visibility, score thresholds and security checks intact.
[python]
allowed_non_product_paths = [
  "scripts/demo/verify-audit-gif.py",
  "scripts/demo/generate-audit-font.py",
  "scripts/demo/verify-audit-gif.test.py",
]
