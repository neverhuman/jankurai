name: family-update
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: family-automation
  cancel-in-progress: false
jobs:
  rotation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - run: bash ops/ci/check-token-rotation.sh
        env:
          AUTOMATION_TOKEN_EXPIRES: ${{ vars.FAMILY_AUTOMATION_TOKEN_EXPIRES }}
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      changed: ${{ steps.candidate.outputs.changed }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b3b07ba8b418998c39fb20f53e8b695cdcc8de1b
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          package-manager-cache: false
      - uses: taiki-e/install-action@9ca1734d8940023f074414ee621fd530c4ce10f2
        with:
          tool: cargo-nextest@0.9.137,cargo-audit@0.22.1,cargo-deny@0.19.8,syft@1.40.0,zizmor@1.25.2
          fallback: none
      - run: bash ops/ci/github-setup.sh
      - id: candidate
        run: bash ops/ci/collect-family.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.candidate.outputs.changed == 'true'
        with:
          name: candidate-locks
          path: target/candidate/*
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate-locks
          path: target/candidate
      - run: bash ops/ci/publish-family.sh publish
        env:
          GH_TOKEN: ${{ secrets.FAMILY_AUTOMATION_TOKEN }}
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - run: bash ops/ci/publish-family.sh merge
        env:
          GH_TOKEN: ${{ secrets.FAMILY_AUTOMATION_TOKEN }}
