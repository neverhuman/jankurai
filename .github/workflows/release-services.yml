name: release services
on:
  push:
    branches: [main, 'migration/**']
    paths:
      - '.github/workflows/release-services.yml'
      - 'ops/ci/release-services.sh'
      - 'ops/ci/install-gh.sh'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-services-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
        with:
          cosign-release: v3.1.3
      - run: bash ops/ci/install-gh.sh
      - run: bash ops/ci/release-services.sh prepare
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        id: attestation
        with:
          subject-path: target/release-services/probe.txt
      - run: bash ops/ci/release-services.sh verify
        env:
          ATTESTATION_BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-service-probe-${{ matrix.os }}
          path: target/release-services/*
          if-no-files-found: error
