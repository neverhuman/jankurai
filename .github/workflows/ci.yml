name: ci

# Continuous integration for the jankurai public hub.
# Thin workflow: every job delegates to ops/ci/<lane>.sh so local runs and CI
# execute the exact same commands (see scripts/ci-local.sh). Three lanes:
# fast (family validation), security (secret scanning + dependency/supply-chain
# review), and a jankurai audit lane that publishes repo-score artifacts.
# Every third-party action is pinned to a full 40-character commit SHA.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: fast-validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Cache local audit state
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.4
        with:
          path: target/jankurai
          key: jankurai-audit-${{ github.ref }}
      - name: Deterministic fast lane
        run: bash ops/ci/fast.sh

  security:
    name: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks secret scan
        uses: gitleaks/gitleaks-action@83373cf2f8c4db6e24b41c1a9b086bb9619e9cd3 # v2.3.6
        env:
          GITLEAKS_VERSION: "8.18.4"
      - name: Generate SBOM (syft)
        run: syft scan dir:. -o cyclonedx-json=target/jankurai/security/sbom.json
      - name: Lint pinned workflows (actionlint)
        run: actionlint .github/workflows/ci.yml
      - name: Secret, SBOM, and dependency review lane
        run: bash ops/ci/security.sh

  audit:
    name: jankurai-audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run jankurai audit lane
        run: bash ops/ci/audit.sh
      - name: Upload repo-score artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: repo-score
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md

  tool-adoption:
    name: tool-adoption-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Run adopted jankurai tool lanes
        run: bash ops/ci/tool-adoption.sh
      - name: Upload tool-adoption evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tool-adoption-evidence
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            target/jankurai/repo-score.json
            target/jankurai/repo-score.md
            target/jankurai/repair-queue.jsonl
