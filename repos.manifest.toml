schema_version = "1.0.0"
family = "jankurai"
public_owner = "neverhuman"
local_owner = "root"
release = "1.7.0-split.0"
source_repo = "root/jankurai"
source_commit = "cea83b0cbe204be276a2f0299cd760f6812ea2b0"

[[repo]]
name = "jankurai"
role = "public-hub"
github = "https://github.com/neverhuman/jankurai.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai.git"
tag = "jankurai-v1.7.0-split.0"
ci = "bash scripts/validate-family.sh"

[[repo]]
name = "jankurai-core"
role = "auditor-core"
github = "https://github.com/neverhuman/jankurai-core.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-core.git"
tag = "jankurai-core-v1.7.0-split.0"
ci = "cargo metadata --no-deps --format-version 1"

[[repo]]
name = "jankurai-contracts"
role = "artifact-contracts"
github = "https://github.com/neverhuman/jankurai-contracts.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-contracts.git"
tag = "jankurai-contracts-v1.7.0-split.0"
ci = "find schemas -name '*.json' -maxdepth 1 -print | sort | xargs -r -n1 jq empty"

[[repo]]
name = "jankurai-standard"
role = "public-standard"
github = "https://github.com/neverhuman/jankurai-standard.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-standard.git"
tag = "jankurai-standard-v1.7.0-split.0"
ci = "test -f docs/agent-native-standard.md && test -f docs/mission.md"

[[repo]]
name = "jankurai-conformance"
role = "conformance-corpus"
github = "https://github.com/neverhuman/jankurai-conformance.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-conformance.git"
tag = "jankurai-conformance-v1.7.0-split.0"
ci = "test -d conformance/fixtures && test -d conformance/expected"

[[repo]]
name = "jankurai-paper"
role = "paper"
github = "https://github.com/neverhuman/jankurai-paper.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-paper.git"
tag = "jankurai-paper-v1.7.0-split.0"
ci = "latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=paper paper/jankurai.tex"

[[repo]]
name = "jankurai-tools-tui"
role = "tui-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-tui.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-tui.git"
tag = "jankurai-tools-tui-v1.7.0-split.0"
ci = "cargo test --workspace --locked"

[[repo]]
name = "jankurai-tools-ux"
role = "ux-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-ux.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-ux.git"
tag = "jankurai-tools-ux-v1.7.0-split.0"
ci = "npm ci && npm run build && npm test"

[[repo]]
name = "jankurai-tools-guard"
role = "guard-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-guard.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-guard.git"
tag = "jankurai-tools-guard-v1.7.0-split.0"
ci = "cargo test --workspace --locked"

[[repo]]
name = "jankurai-tools-proof"
role = "proof-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-proof.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-proof.git"
tag = "jankurai-tools-proof-v1.7.0-split.0"
ci = "cargo test --workspace --locked"

[[repo]]
name = "jankurai-tools-dedup"
role = "dedup-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-dedup.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-dedup.git"
tag = "jankurai-tools-dedup-v1.7.0-split.0"
ci = "test -d src-snapshot && find src-snapshot -type f | sort | head -n 1 >/dev/null"

[[repo]]
name = "jankurai-tools-analyzers"
role = "analyzer-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-analyzers.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-analyzers.git"
tag = "jankurai-tools-analyzers-v1.7.0-split.0"
ci = "test -d src-snapshot && find src-snapshot -type f | sort | head -n 1 >/dev/null"

[[repo]]
name = "jankurai-tools-fleet"
role = "fleet-tool-family"
github = "https://github.com/neverhuman/jankurai-tools-fleet.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-tools-fleet.git"
tag = "jankurai-tools-fleet-v1.7.0-split.0"
ci = "test -d src-snapshot && find src-snapshot -type f | sort | head -n 1 >/dev/null"

[[repo]]
name = "jankurai-deploy"
role = "deploy-and-mirroring"
github = "https://github.com/neverhuman/jankurai-deploy.git"
jeryu = "ssh://git@127.0.0.1:2224/root/jankurai-deploy.git"
tag = "jankurai-deploy-v1.7.0-split.0"
ci = "bash scripts/ci-local.sh required"
