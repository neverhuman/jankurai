name: "Jankurai"
description: "Anti-vibe coding standard and local audit CLI for auditable AI-assisted merge"
branding:
  icon: "check-circle"
  color: "green"

inputs:
  release-tag:
    description: "Jankurai release tag to install from neverhuman/jankurai releases"
    required: false
    default: "v1.7.0"
  mode:
    description: "Audit mode: advisory, ratchet, or release"
    required: false
    default: "advisory"
  baseline:
    description: "Path to accepted baseline score JSON (required for ratchet or release mode)"
    required: false
    default: "agent/baselines/main.repo-score.json"

runs:
  using: "composite"
  steps:
    - name: Install released jankurai
      shell: bash
      env:
        JANKURAI_RELEASE_TAG: ${{ inputs.release-tag }}
      run: |
        bash "$GITHUB_ACTION_PATH/jankurai-installer.sh"

    - name: Prepare jankurai artifact directories
      shell: bash
      run: mkdir -p target/jankurai target/jankurai/security

    - name: Run jankurai audit
      shell: bash
      env:
        AUDIT_MODE: ${{ inputs.mode }}
        AUDIT_BASELINE: ${{ inputs.baseline }}
      run: |
        if [ "$AUDIT_MODE" = "ratchet" ] || [ "$AUDIT_MODE" = "release" ]; then
          "$HOME/.local/bin/jankurai" audit . --mode "$AUDIT_MODE" --baseline "$AUDIT_BASELINE" --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl
        else
          "$HOME/.local/bin/jankurai" audit . --mode "$AUDIT_MODE" --json target/jankurai/repo-score.json --md target/jankurai/repo-score.md --sarif target/jankurai/jankurai.sarif --github-step-summary target/jankurai/summary.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl
        fi

    - name: Publish jankurai summary
      shell: bash
      if: always()
      run: |
        if [ -f target/jankurai/summary.md ]; then
          cat target/jankurai/summary.md >> "$GITHUB_STEP_SUMMARY"
        fi
