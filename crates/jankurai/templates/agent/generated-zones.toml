# Local .jankurai score reports are ignored audit state, not generated-zone
# source contracts. Badge SVG/JSON are generated by `jankurai badge`.

[[zones]]
path = "agent/jankurai-badge.svg"
generator = "jankurai badge --update-readme"
manual_edits = false

[[zones]]
path = "agent/jankurai-badge.json"
generator = "jankurai badge --update-readme"
manual_edits = false
