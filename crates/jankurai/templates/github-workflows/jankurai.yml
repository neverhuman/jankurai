name: jankurai

on:
  pull_request:
  push:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned Jankurai 1.6.11
        env:
          JANKURAI_TAG: v1.6.11-deadlang-precision-split.3
          JANKURAI_SHA256: 9e6b8857a26f6004d4c74e510e13b06d880f2e2ae0c89502698889ed690c5d6c
        run: |
          set -euo pipefail
          name=jankurai-1.6.11-deadlang-precision-split.3-x86_64-unknown-linux-gnu
          curl --proto "=https" --tlsv1.2 -fsSL -o "$name.tar.gz" \
            "https://github.com/neverhuman/jankurai/releases/download/$JANKURAI_TAG/$name.tar.gz"
          tar -xzf "$name.tar.gz"
          echo "$JANKURAI_SHA256  $name/jankurai" | sha256sum -c -
          sudo install -m 0755 "$name/jankurai" /usr/bin/jankurai
          test "$(jankurai --version)" = "jankurai 1.6.11"
      - run: jankurai --version
      - name: jankurai audit
        run: jankurai audit . --full --mode standard --no-score-history --json .jankurai/repo-score.json --md .jankurai/repo-score.md --repair-queue-jsonl target/jankurai/repair-queue.jsonl
      - name: jankurai badge --check
        run: jankurai badge --check --update-readme
      - name: Proofbind verify
        run: jankurai proofbind verify . --changed-from origin/main
      - name: Proofmark rust
        run: jankurai proofmark rust . --obligations target/jankurai/proofbind/obligations.json
      - name: Rust witness build
        run: jankurai rust witness build .
      - name: UX QA smoke
        run: jankurai ux audit --config agent/ux-qa.toml --out target/jankurai/ux-qa.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: jankurai-adoption-evidence
          if-no-files-found: ignore
          path: |
            .jankurai/repo-score.json
            .jankurai/repo-score.md
            agent/jankurai-badge.svg
            agent/jankurai-badge.json
            target/jankurai/repair-queue.jsonl
            target/jankurai/proofbind/obligations.json
            target/jankurai/ux-qa.json
